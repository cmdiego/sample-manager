# Sample Manager configuration
# Location: ~/.sample_manager/config.yaml

db_path: "~/.sample_manager/sample_manager.sqlite3"

library_roots: []
default_library_root: null

# Directory containing arrangement_profiles.yaml and export_profiles.yaml
profiles_dir: "~/.sample_manager/profiles"

defaults:
  export_mode: "copy"          # copy | symlink
  collision_policy: "suffix"   # fail | suffix | dedupe_hash
  on_violation: "autofix"      # autofix | fail
  preview_format: "table"      # table | json
  confirmations: true

# Optional v2 audio and terminal appearance (older configs remain valid).
audio:
  engine: python
  buffer_frames: 1024
  prefetch_depth: 3
  cache_mb: 256
tui:
  auto_audition: true
  theme: dark
