[project]
name = "sample-manager"
version = "0.1.0"
requires-python = ">=3.10"
dependencies = [
  "typer>=0.12",
  "pyyaml>=6.0",
  "textual>=0.50",
  "PySide6>=6.6",
  "numpy>=1.24",
  "soundfile>=0.12",
  "sounddevice>=0.5",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.0",
  "pytest-qt>=4.2",
]
# Optional compressed-format and metadata backends. Core WAV decoding, numeric
# processing, and system playback are provided by the standard dependencies.
audio = [
  "audioread>=3.0",
  "mutagen>=1.45",
]

[project.scripts]
sampleman = "sample_manager.cli:app"

[tool.pytest.ini_options]
testpaths = ["tests"]
