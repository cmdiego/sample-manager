[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "sample-manager"
version = "0.1.0"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
  "typer>=0.12",
  "pyyaml>=6.0",
  "textual>=8.2,<9",
  "PySide6>=6.6",
  "numpy>=1.24",
  "soundfile>=0.12",
  "sounddevice>=0.5",
  "soxr>=0.3",
]

[project.optional-dependencies]
native = ["sample-manager-engine==0.1.0"]
dev = [
  "pytest>=8.0",
  "pytest-qt>=4.2",
]
# Optional compressed-format and metadata backends. Core WAV decoding, numeric
# processing, and system playback are provided by the standard dependencies.
audio = [
  "audioread>=3.0",
  "mutagen>=1.45",
]

[project.scripts]
sampleman = "sample_manager.cli:app"

[tool.pytest.ini_options]
testpaths = ["tests"]

# Installed frontends need their styles even when no source checkout is present.
[tool.setuptools.package-data]
"sample_manager.gui" = ["*.qss"]
"sample_manager.tui.styles" = ["*.tcss"]
