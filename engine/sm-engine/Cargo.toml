[package]
name = "sm-engine"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "Bounded native audition transport, decoder workers and output"
repository = "https://github.com/cmdiego/sample-manager"

[dependencies]
cpal = "=0.16.0"
symphonia = { version = "=0.5.5", default-features = false, features = ["wav", "aiff", "flac", "pcm", "mp3"] }
rubato = "=0.16.2"
rtrb = "=0.3.2"
crossbeam-channel = "=0.5.15"

[dev-dependencies]
assert_no_alloc = "=1.1.2"
hound = "=3.5.1"
